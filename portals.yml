# Portal Scanner Configuration
# Job discovery and filtering for Santiago's job search

search_queries:
  # Ashby job board
  - name: "ashby-ai"
    query: "site:jobs.ashbyhq.com \"AI\" OR \"Machine Learning\" OR \"LLM\""
    enabled: true
  - name: "ashby-product"
    query: "site:jobs.ashbyhq.com \"Product Manager\" AI"
    enabled: true
  - name: "ashby-solutions"
    query: "site:jobs.ashbyhq.com \"Solutions Architect\" OR \"Forward Deployed\""
    enabled: true
  
  # Greenhouse job board
  - name: "greenhouse-ai"
    query: "site:job-boards.greenhouse.io OR site:job-boards.eu.greenhouse.io \"AI\" OR \"Machine Learning\" OR \"LLM\" OR \"Agentic\""
    enabled: true
  - name: "greenhouse-product"
    query: "site:job-boards.greenhouse.io OR site:job-boards.eu.greenhouse.io \"Product Manager\" AI"
    enabled: true
  - name: "greenhouse-solutions"
    query: "site:job-boards.greenhouse.io OR site:job-boards.eu.greenhouse.io \"Solutions Architect\" OR \"Solutions Engineer\" AI"
    enabled: true
  - name: "greenhouse-forward-deployed"
    query: "site:job-boards.greenhouse.io OR site:job-boards.eu.greenhouse.io \"Forward Deployed\" OR \"Forward-Deployed\" OR \"Customer Engineer\""
    enabled: true
  
  # Lever job board
  - name: "lever-ai"
    query: "site:jobs.lever.co \"AI\" OR \"Machine Learning\" OR \"LLM\""
    enabled: true
  - name: "lever-product"
    query: "site:jobs.lever.co \"Product Manager\" AI"
    enabled: true

  # Direct company searches
  - name: "anthropic-careers"
    query: "site:anthropic.com/jobs \"Applied AI\" OR \"Solutions\" OR \"Forward Deployed\""
    enabled: true
  - name: "openai-careers"
    query: "site:openai.com/careers \"Product\" OR \"Solutions\" OR \"Forward Deployed\""
    enabled: true
  - name: "n8n-careers"
    query: "site:n8n.io/careers OR site:jobs.ashbyhq.com/n8n"
    enabled: true
  - name: "airtable-careers"
    query: "site:airtable.com/careers \"Solutions\" OR \"AI\""
    enabled: true

