title_filter:
  # Keywords that MUST appear in job titles (at least one)
  positive:
    - "AI"
    - "Machine Learning"
    - "LLM"
    - "Agentic"
    - "Product Manager"
    - "Solutions"
    - "Forward Deployed"
    - "Forward-Deployed"
    - "Automation"
    - "Platform"
    - "Developer Relations"
    - "AI Enablement"
    - "Technical"
  
  # Keywords that EXCLUDE jobs (any match = skip)
  negative:
    - "Intern"
    - "Internship"
    - "Junior"
    - "Entry Level"
    - "Graduate"
    - "Apprentice"
    - "Sales Development"
    - "SDR"
    - "BDR"
    - "Recruiter"
    - "HR"
  
  # Keywords that boost priority (senior roles)
  seniority_boost:
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head"
    - "Director"
    - "Manager"
    - "Architect"
    - "Forward Deployed"
    - "Solutions"
